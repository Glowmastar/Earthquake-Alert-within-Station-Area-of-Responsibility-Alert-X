# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

# Deploy the current React website and Express scraper together.
# The separate server/src database API and worker are not used by this UI.
previews:
  generation: off

services:
  - type: web
    runtime: node
    name: alertx-api
    repo: https://github.com/Glowmastar/Earthquake-Alert-within-Station-Area-of-Responsibility-Alert-X
    branch: main
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    # Clear the previous database-migration hook on an existing service.
    preDeployCommand: ""
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
