x-app: &app
  build:
    context: .
    args:
      VITE_TILE_URL: ${VITE_TILE_URL:-}
      VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-}
  env_file: .env
  environment:
    DATABASE_URL: postgresql://alertx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/alertx
    PORT: 4000
  init: true
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: alertx
      POSTGRES_USER: alertx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["alertx_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertx -d alertx"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["node", "build/server/migrate.js"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:3000:4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    command: ["node", "build/server/worker.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  alertx_pgdata:
