<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky & Atmosphere Gradient -->
    <linearGradient id="skyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#081b3a" />
      <stop offset="40%" stopColor="#0f2b54" />
      <stop offset="70%" stopColor="#184277" />
      <stop offset="85%" stopColor="#1f548f" />
      <stop offset="100%" stopColor="#2564a8" />
    </linearGradient>

    <!-- Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#0d335c" />
      <stop offset="25%" stopColor="#0a294d" />
      <stop offset="60%" stopColor="#071e3b" />
      <stop offset="100%" stopColor="#041226" />
    </linearGradient>

    <!-- Distant Mountains Layer 1 (Far haze) -->
    <linearGradient id="farMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#234a78" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#163459" stopOpacity="0.8" />
    </linearGradient>

    <!-- Main Island Peaks -->
    <linearGradient id="mainIsland" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1b4d6e" />
      <stop offset="50%" stopColor="#133d59" />
      <stop offset="100%" stopColor="#0b283d" />
    </linearGradient>

    <!-- Near Island Ridge -->
    <linearGradient id="nearIsland" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#18536b" />
      <stop offset="60%" stopColor="#0e394d" />
      <stop offset="100%" stopColor="#072230" />
    </linearGradient>

    <!-- Horizon Sun / Glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stopColor="#60a5fa" stopOpacity="0.45" />
      <stop offset="40%" stopColor="#38bdf8" stopOpacity="0.25" />
      <stop offset="80%" stopColor="#0284c7" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#0f2b54" stopOpacity="0" />
    </radialGradient>

    <!-- Water Reflections -->
    <linearGradient id="waterSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.25" />
      <stop offset="50%" stopColor="#0ea5e9" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#0369a1" stopOpacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="1920" height="600" fill="url(#skyGrad)" />

  <!-- Atmospheric Glow at Horizon -->
  <circle cx="960" cy="560" r="700" fill="url(#horizonGlow)" />

  <!-- Soft Distant Cloud Silhouettes -->
  <g opacity="0.4" fill="#38bdf8">
    <path d="M120,420 Q220,380 320,410 Q420,370 540,400 Q660,360 800,420 L800,470 L120,470 Z" opacity="0.3" />
    <path d="M1100,390 Q1240,350 1380,380 Q1500,340 1640,380 Q1780,350 1880,410 L1880,460 L1100,460 Z" opacity="0.35" />
    <path d="M600,430 Q720,390 860,420 Q980,380 1120,410 Q1240,380 1360,430 L1360,480 L600,480 Z" opacity="0.25" />
  </g>

  <!-- Far Distant Island Mountain Peaks (Deep Haze) -->
  <path d="M480,560 
           L560,520 Q640,490 710,515 
           Q780,470 850,510 
           Q910,480 970,515 
           Q1040,475 1110,505 
           Q1180,485 1260,530 
           Q1340,505 1420,560 Z" 
        fill="url(#farMountain)" />

  <!-- Main Distant Tropical Island Silhouette -->
  <!-- Majestic volcanic/limestone island ridges typical of the Philippine archipelago (like Palawan or Batanes) -->
  <path d="M380,560 
           C430,555 470,535 510,510 
           C540,490 570,450 610,435 
           C650,420 680,450 710,460 
           C750,470 780,430 830,410 
           C870,390 910,420 950,385 
           C980,360 1020,390 1060,425 
           C1110,460 1150,430 1190,445 
           C1230,460 1260,490 1300,480 
           C1350,470 1390,520 1440,535 
           C1490,550 1530,558 1580,560 Z" 
        fill="url(#mainIsland)" />

  <!-- Outlying Smaller Island Islets on the Horizon -->
  <!-- Left satellite islet -->
  <path d="M220,560 C250,558 275,542 300,538 C320,535 340,550 365,560 Z" fill="url(#mainIsland)" opacity="0.85" />
  <!-- Right satellite islet -->
  <path d="M1620,560 C1650,558 1680,545 1710,540 C1735,537 1760,552 1790,560 Z" fill="url(#mainIsland)" opacity="0.85" />

  <!-- Island Ridges & Contours (Subtle depth Highlights) -->
  <path d="M540,560 
           C570,530 610,490 640,480 
           C670,470 700,490 730,510 
           C780,520 830,460 880,450 
           C930,440 960,470 1000,450 
           C1040,430 1080,460 1120,495 
           C1160,530 1210,510 1260,535 
           C1300,550 1350,556 1400,560 Z" 
        fill="url(#nearIsland)" opacity="0.75" />

  <!-- Sea Mist / Shoreline Fog Belt across Base of Island -->
  <rect x="0" y="545" width="1920" height="28" fill="#38bdf8" opacity="0.18" />
  <rect x="300" y="550" width="1320" height="18" fill="#e0f2fe" opacity="0.22" />

  <!-- Horizon Line -->
  <line x1="0" y1="560" x2="1920" y2="560" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4" />

  <!-- Ocean Water Base -->
  <rect y="560" width="1920" height="520" fill="url(#oceanGrad)" />

  <!-- Island Water Reflection Sheen -->
  <polygon points="460,560 1480,560 1320,780 620,780" fill="url(#waterSheen)" />

  <!-- Ocean Water Surface Wave Ripples -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.2" stroke-linecap="round">
    <line x1="850" y1="566" x2="1070" y2="566" />
    <line x1="720" y1="575" x2="1200" y2="575" stroke-width="1.2" opacity="0.25" />
    <line x1="580" y1="588" x2="1340" y2="588" stroke-width="1.4" opacity="0.22" />
    <line x1="420" y1="605" x2="1500" y2="605" stroke-width="1.6" opacity="0.28" />
    <line x1="280" y1="630" x2="1640" y2="630" stroke-width="1.8" opacity="0.22" />
    <line x1="150" y1="665" x2="1770" y2="665" stroke-width="2" opacity="0.2" />
    <line x1="80" y1="710" x2="1840" y2="710" stroke-width="2.2" opacity="0.18" />
    <line x1="50" y1="770" x2="1870" y2="770" stroke-width="2.5" opacity="0.15" />
    <line x1="20" y1="850" x2="1900" y2="850" stroke-width="2.8" opacity="0.12" />
    <line x1="0" y1="950" x2="1920" y2="950" stroke-width="3" opacity="0.1" />
  </g>
</svg>
